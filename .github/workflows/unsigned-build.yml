name: Build MyFileManager device IPA

on:
  workflow_dispatch:

jobs:
  device-build:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select newer installed Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Extract audited project archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="MyFileManager-iOS-Phase11-Audited.zip"
          test -f "$ARCHIVE"
          rm -rf extracted-project
          mkdir extracted-project
          unzip -q "$ARCHIVE" -d extracted-project
          PROJECT_ROOT="$(find extracted-project -name project.yml -print -quit | xargs dirname)"
          test -n "$PROJECT_ROOT"
          cp -R "$PROJECT_ROOT"/. .
          test -f project.yml
          test -f Config/Info.plist

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive for physical iPhone without Apple signing
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild archive \
            -project MyFileManager.xcodeproj \
            -scheme MyFileManager \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/MyFileManager.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          test -d build/MyFileManager.xcarchive/Products/Applications/MyFileManager.app

      - name: Package unsigned IPA with Payload directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ipa-payload
          mkdir -p ipa-payload/Payload
          cp -R build/MyFileManager.xcarchive/Products/Applications/MyFileManager.app ipa-payload/Payload/
          mkdir -p artifacts
          (cd ipa-payload && /usr/bin/zip -qry ../artifacts/MyFileManager-unsigned.ipa Payload)
          unzip -t artifacts/MyFileManager-unsigned.ipa
          unzip -l artifacts/MyFileManager-unsigned.ipa | sed -n '1,30p'
          unzip -l artifacts/MyFileManager-unsigned.ipa | grep -q 'Payload/MyFileManager.app/Info.plist'

      - name: Upload unsigned device IPA and archive
        uses: actions/upload-artifact@v4
        with:
          name: MyFileManager-iPhone-unsigned
          path: artifacts/MyFileManager-unsigned.ipa
          if-no-files-found: error
